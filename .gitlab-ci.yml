stages:
- test
- secret-detection
- build
- security
- push
- deploy

variables:
  SECRET_DETECTION_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: "node_modules, dist, build, fichiersMD, coverage"

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

test-backend:
  stage: test
  image: node:20-alpine
  cache:
    key: backend-deps
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test

sast:
  stage: test

secret_detection:
  stage: secret-detection

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/todo-backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/todo-backend:$CI_COMMIT_SHORT_SHA

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/todo-frontend:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/todo-frontend:$CI_COMMIT_SHORT_SHA

update-manifests:
  stage: push
  image: alpine/git:latest
  before_script:
    - git config --global user.email "ci-bot@indio.lan"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://tum_adm:${GIT_PUSH_TOKEN}@gitlab.indio.lan/indio/pj_kubernetes.git"
  script:
    # Keep the Git manifest in sync with the image actually built/pushed by this pipeline,
    # so it stops drifting from what's really deployed (was stuck on a stale "v2" placeholder).
    - 'sed -i -E "s#^(\s*)image: .*#\1image: ${CI_REGISTRY_IMAGE}/todo-backend:${CI_COMMIT_SHORT_SHA}#" k8s/backend/deployment.yaml'
    - 'sed -i -E "s#^(\s*)image: .*#\1image: ${CI_REGISTRY_IMAGE}/todo-frontend:${CI_COMMIT_SHORT_SHA}#" k8s/frontend/deployment.yaml'
    - git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
    - 'git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "chore(k8s): bump image tags to ${CI_COMMIT_SHORT_SHA} [skip ci]" && git push origin HEAD:${CI_COMMIT_REF_NAME})'
  only:
    - thomas

deploy:
  stage : deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]

  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl set image deployment/todo-backend todo-backend=$CI_REGISTRY_IMAGE/todo-backend:$CI_COMMIT_SHORT_SHA -n todo-app
    - kubectl set image deployment/todo-frontend todo-frontend=$CI_REGISTRY_IMAGE/todo-frontend:$CI_COMMIT_SHORT_SHA -n todo-app
    - kubectl rollout status deployment/todo-backend -n todo-app
    - kubectl rollout status deployment/todo-frontend -n todo-app
  only:
    - thomas
